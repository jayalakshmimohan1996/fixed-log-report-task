artifacts = ["/app/report.json"]

[task]
name = "dynamo/log-report"
description = "Parse an Apache-style access log into a small JSON summary report."

[metadata]
category = "data_processing_and_etl"
subcategory = "text_processing"
task_objective = ["transform", "generate"]
artifact_type = ["text_or_log_file", "generated_output_artifact"]
expert_time_estimate_hours = 0.5
model_tested = "GPT-5.4"
agent_tested = "Terminus-2"
difficulty_explanation = "The task is simple but requires correctly parsing Apache-style log lines, aggregating client and path counts, and emitting an exact JSON report rather than free-form prose."
solution_explanation = "Read /app/access.log line by line, extract the client IP and request path from each non-empty entry, count total requests, unique clients, per-client requests, and per-path requests, then write the required JSON object to /app/report.json."
verification_explanation = "The verifier loads /app/report.json, checks the exact schema and data types, and compares the computed request totals, sorted client counts, sorted path counts, and top path against the expected values for the bundled log."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 120.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
